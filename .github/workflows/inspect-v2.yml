name: Rebuild and validate V2 current manifest

on:
  push:
    branches:
      - codex/current-manifest-v2
    paths:
      - .github/workflows/inspect-v2.yml
      - 00_CURRENT_REPAIR_V2.zip

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract V2 and preserve historical manifest
        shell: bash
        run: |
          set -euo pipefail
          work_dir="${RUNNER_TEMP}/healthinfo-v2"
          mkdir -p "$work_dir/extracted"
          unzip -q 00_CURRENT_REPAIR_V2.zip -d "$work_dir/extracted"
          archive_root="$(find "$work_dir/extracted" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$archive_root"
          git show b7cbd1fd6d237bfe2120208cfb26e46a57024f80:modeling/day20_22/day22_code_freeze_manifest.csv \
            > "$archive_root/modeling/day20_22/HISTORICAL_day22_code_freeze_manifest_29rows.csv"
          echo "ARCHIVE_ROOT=$archive_root" >> "$GITHUB_ENV"
          echo "WORK_DIR=$work_dir" >> "$GITHUB_ENV"

      - name: Rebuild current manifest from freeze definition
        shell: bash
        run: |
          set -euo pipefail
          python - "$ARCHIVE_ROOT" <<'PY'
          from pathlib import Path
          import ast
          import csv
          import hashlib
          import sys

          root = Path(sys.argv[1])
          freeze_script = root / "scripts/day20_22_error_robustness_freeze.py"
          tree = ast.parse(freeze_script.read_text(encoding="utf-8"))

          outputs = None
          base_paths = None
          for node in ast.walk(tree):
              if not isinstance(node, ast.Assign) or len(node.targets) != 1:
                  continue
              target = node.targets[0]
              if not isinstance(target, ast.Name) or not isinstance(node.value, ast.List):
                  continue
              if target.id == "outputs" and outputs is None:
                  outputs = [ast.literal_eval(item) for item in node.value.elts]
              elif target.id == "freeze_paths" and base_paths is None:
                  parsed = []
                  for item in node.value.elts:
                      if (
                          isinstance(item, ast.Call)
                          and isinstance(item.func, ast.Name)
                          and item.func.id == "Path"
                          and len(item.args) == 1
                      ):
                          parsed.append(Path(ast.literal_eval(item.args[0])))
                      else:
                          raise RuntimeError("Unsupported freeze_paths expression")
                  base_paths = parsed

          if outputs is None or base_paths is None:
              raise RuntimeError("Could not derive outputs/freeze_paths from freeze script")

          freeze_paths = list(base_paths)
          freeze_paths.extend(
              Path("modeling/day20_22") / relative
              for relative in outputs
              if relative not in {"day22_code_freeze_manifest.csv", "day20_22_config_log.json"}
          )

          if len(freeze_paths) != 30 or len(set(freeze_paths)) != 30:
              raise RuntimeError(f"Expected 30 unique freeze paths, found {len(freeze_paths)}")

          def sha256(path: Path) -> str:
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(block)
              return digest.hexdigest()

          rows = []
          for relative in freeze_paths:
              absolute = root / relative
              if not absolute.is_file():
                  raise FileNotFoundError(absolute)
              rel = relative.as_posix()
              rows.append({
                  "Relative_path": rel,
                  "SHA256": sha256(absolute),
                  "Size_bytes": absolute.stat().st_size,
                  "Freeze_role": "Upstream lock" if "day20_22" not in rel else "Day20-22 code/output",
              })

          manifest = root / "modeling/day20_22/day22_code_freeze_manifest.csv"
          with manifest.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(
                  handle,
                  fieldnames=["Relative_path", "SHA256", "Size_bytes", "Freeze_role"],
                  lineterminator="\n",
              )
              writer.writeheader()
              writer.writerows(rows)

          historical = root / "modeling/day20_22/HISTORICAL_day22_code_freeze_manifest_29rows.csv"
          with historical.open("r", encoding="utf-8-sig", newline="") as handle:
              old_rows = list(csv.DictReader(handle))
          if len(old_rows) != 29:
              raise RuntimeError(f"Historical manifest must have 29 entries, found {len(old_rows)}")

          print(f"REBUILT_CURRENT_MANIFEST={len(rows)}/30")
          print(f"PRESERVED_HISTORICAL_MANIFEST={len(old_rows)} entries")
          PY

      - name: Validate current hash and size freeze
        shell: bash
        run: |
          set -euo pipefail
          python - "$ARCHIVE_ROOT" <<'PY'
          from pathlib import Path
          import csv
          import hashlib
          import sys

          root = Path(sys.argv[1])
          manifest = root / "modeling/day20_22/day22_code_freeze_manifest.csv"
          with manifest.open("r", encoding="utf-8-sig", newline="") as handle:
              rows = list(csv.DictReader(handle))

          failures = []
          for row in rows:
              target = root / row["Relative_path"]
              if not target.is_file():
                  failures.append(f"missing: {row['Relative_path']}")
                  continue
              actual_size = target.stat().st_size
              digest = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual_size != int(row["Size_bytes"]):
                  failures.append(f"size: {row['Relative_path']}")
              if digest != row["SHA256"]:
                  failures.append(f"sha256: {row['Relative_path']}")

          if len(rows) != 30:
              failures.append(f"row count: {len(rows)}")
          if len({row["Relative_path"] for row in rows}) != len(rows):
              failures.append("duplicate paths")
          if failures:
              raise SystemExit("CURRENT MANIFEST FAIL\n" + "\n".join(failures))
          print("PASS CURRENT MANIFEST: 30/30 files match SHA256 and Size_bytes")
          PY

      - name: Update Day 23-24 audit notes after manifest pass
        shell: bash
        run: |
          set -euo pipefail
          python - "$ARCHIVE_ROOT" <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          marker = "<!-- V2_CURRENT_MANIFEST_VALIDATED -->"
          section = """
          <!-- V2_CURRENT_MANIFEST_VALIDATED -->
          ## V2 current-manifest validation

          - day22_code_freeze_manifest.csv was regenerated programmatically from the freeze definition and the files present in 00_CURRENT_REPAIR_V2.
          - Current freeze: 30/30 entries passed SHA-256 and byte-size verification.
          - The original 29-entry freeze remains unchanged as HISTORICAL_day22_code_freeze_manifest_29rows.csv.
          - The archive contains aggregate artifacts only; no HHX/person-level prediction file is included.
          """
          targets = [
              root / "research_log/Day23_24_Manuscript_Assembly.md",
              root / "docs/Day23_24_UHS_Review_Guide.md",
          ]
          for path in targets:
              text = path.read_text(encoding="utf-8")
              if marker not in text:
                  path.write_text(text.rstrip() + "\n\n" + section.strip() + "\n", encoding="utf-8")
          PY

      - name: Run aggregate validators and privacy checks
        shell: bash
        run: |
          set -euo pipefail
          cd "$ARCHIVE_ROOT"
          python -m pip install -q -r requirements.txt
          python scripts/validate_day17_19_outputs.py
          python scripts/validate_day20_22_outputs.py
          python scripts/validate_day23_24_outputs.py
          python -m compileall -q scripts
          python - <<'PY'
          from pathlib import Path
          import csv
          import json

          root = Path.cwd()
          flags = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              low = path.name.lower()
              if "prediction" in low and not low.endswith("_manifest.csv"):
                  flags.append(f"person-level prediction filename: {path.relative_to(root)}")
              if path.suffix.lower() == ".json":
                  json.loads(path.read_text(encoding="utf-8"))
              if path.suffix.lower() == ".csv":
                  with path.open("r", encoding="utf-8-sig", errors="replace", newline="") as handle:
                      header = next(csv.reader(handle), [])
                  if "HHX" in header:
                      flags.append(f"HHX column: {path.relative_to(root)}")
          if flags:
              raise SystemExit("PRIVACY CHECK FAIL\n" + "\n".join(flags))
          print("PASS PRIVACY SCAN: no HHX column or person-level prediction file")
          print("PASS PARSE CHECK: all JSON and CSV artifacts readable")
          PY

      - name: Build deterministic ZIP and commit
        shell: bash
        run: |
          set -euo pipefail
          python - "$ARCHIVE_ROOT" 00_CURRENT_REPAIR_V2.zip <<'PY'
          from pathlib import Path
          import stat
          import sys
          import zipfile

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          temp = output.with_suffix(".zip.tmp")
          with zipfile.ZipFile(temp, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  arcname = (Path(root.name) / path.relative_to(root)).as_posix()
                  info = zipfile.ZipInfo(arcname, date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = (stat.S_IFREG | 0o644) << 16
                  archive.writestr(info, path.read_bytes(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          temp.replace(output)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 00_CURRENT_REPAIR_V2.zip
          if git diff --cached --quiet; then
            echo "ZIP already matches validated deterministic build"
          else
            git commit -m "fix: rebuild and validate V2 current manifest [manifest-freeze]"
            git push
          fi
